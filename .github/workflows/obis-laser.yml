name: obis-laser

on:
    pull_request:
    push:
        branches:
            - main
    release:
        types: [published]
    workflow_dispatch:

jobs:
    # ---- Tests ----
    tests:
        name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.11", "3.12", "3.13"]
            fail-fast: false
        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Install python dependencies
              run: uv sync --group dev --python ${{ matrix.python-version }}

            - name: Run codespell
              run: uv run codespell

            - name: Run ruff format
              run: uv run ruff format --check

            - name: Run ruff check
              run: uv run ruff check

            - name: Run pyright
              run: uv run pyright

            # Hardware tests are skipped automatically because CI is set.
            - name: Run pytest
              run: uv run pytest --cov obis

            - name: Build
              run: uv build

    # ---- Release build ----
    build-release:
        runs-on: ubuntu-latest
        name: Build release distributions
        needs: tests
        if: github.event_name == 'release' && github.event.action == 'published'
        permissions:
            # gh release upload attaches the distributions to the release.
            contents: write

        steps:
            - uses: actions/checkout@v7

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Build
              env:
                  SETUPTOOLS_SCM_PRETEND_VERSION: ${{ github.event.release.tag_name }}
              run: uv build

            - name: Verify setuptools-scm applied the release tag
              shell: bash
              run: |
                  ls -1 dist/
                  if ls dist/*-0.0.0.tar.gz >/dev/null 2>&1; then
                      echo "::error::Built version 0.0.0, so setuptools-scm did not apply the tag. Check that pyproject.toml still declares a tool.setuptools_scm table."
                      exit 1
                  fi

            - name: Upload distributions as artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/

            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload --repo ${{ github.repository }} ${{ github.event.release.tag_name }} dist/* --clobber

    # ---- Publish to PyPI ----
    publish-to-pypi:
        runs-on: ubuntu-latest
        name: Publish to PyPI
        needs: build-release
        environment: pypi
        permissions:
            # uv publish exchanges this token with PyPI trusted publishing.
            id-token: write
        steps:
            - name: Download distributions artifact
              uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist/

            - uses: astral-sh/setup-uv@v8.3.2
              with:
                  enable-cache: true

            - name: Publish to PyPI
              run: uv publish
